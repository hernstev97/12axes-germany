<section class="grid page-width">
  <div class="area-half">
    <h1 class="page-title">Seite nicht gefunden</h1>
    <p class="lead">Unter dieser Adresse gibt es keine Seite.</p>
    <a class="button primary" routerLink="/">Zur Startseite</a>
  </div>
  <app-art-figure
    class="area-figure"
    [artwork]="artwork"
    [priority]="true"
    sizes="(max-width: 860px) min(92vw, 612px), (max-width: 1360px) 35vw, 485px"
  />
</section>
